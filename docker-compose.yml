version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: comic-tracker-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: comic-book-tracker
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - comic-tracker-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: comic-tracker-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/comic-book-tracker?authSource=admin
      JWT_SECRET: your-production-jwt-secret
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - comic-tracker-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: comic-tracker-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - comic-tracker-network

volumes:
  mongodb_data:
    driver: local

networks:
  comic-tracker-network:
    driver: bridge
